<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Thread Reborn</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

<div id="header"></div>

<section class="contact fade-up">

<h2>Contact Us</h2>

<div class="contact-container">

<div class="contact-card">

<i class="fa-solid fa-location-dot"></i>

<h3>Address</h3>

<p>Jamshedpur, Jharkhand, India</p>

</div>

<div class="contact-card">

<i class="fa-solid fa-phone"></i>

<h3>Phone</h3>

<p>+91 9470577288</p>

</div>



</div>

<br><br>

<h2>Send Us a Message</h2>

<form class="contact-form">

<input type="text" placeholder="Your Name" required>

<input type="email" placeholder="Your Email" required>

<input type="text" placeholder="Subject" required>

<textarea rows="6" placeholder="Your Message"></textarea>

<button class="shop-btn" type="submit">

Send Message

</button>

</form>

</section>

<footer>

<div class="footer-container">

<div class="footer-col">

<h3>Thread Reborn</h3>

<p>Giving waste a second life through sustainable shopping.</p>

</div>

<div class="footer-col">

<h3>Follow Us</h3>
<div class="social-icons">

<a href="" target="_blank">
<i class="fab fa-facebook-f"></i>
</a>

<a href="" target="_blank">
<i class="fab fa-instagram"></i>
</a>

</div>

</div>

</div>

<hr>

<p class="copyright">

© 2026 Thread Reborn. All Rights Reserved.

</p>

</footer>

<script src="script.js"></script>
<script src="header.js"></script>
</body>

</html>
